schema_version: '1.0'
policy_id: registry-endpoint-family
version: '7.0'
description: 适应症无关的登记终点族分类规则（per-indication 配置块）
safety_domain_pattern: teae|treatment[- ]emergent|adverse event|\baes\b|\bsae\b|serious
  adverse|number of participants with adverse
rules:
- rule_id: endpoint-pnh-clone-pct-v1
  match_pattern: clone size|pnh clone
  family_meta:
    canonical_id: pnh_clone_pct
    label_zh: PNH 克隆大小变化
    direction: lower_is_better
    form: change_from_baseline
    units:
    - percent
    - '%'
- rule_id: endpoint-pnh-ldh-ratio-v1
  match_pattern: ratio of ldh|ldh[:/ ]*uln|ldh ratio
  family_meta:
    canonical_id: ldh_uln_ratio
    label_zh: LDH/ULN 比值
    direction: lower_is_better
    form: absolute_value
    units:
    - ratio
    - 比值
- rule_id: endpoint-pnh-free-hemoglobin-pct-v1
  match_pattern: percent change in free (hgb|hemoglobin)
  family_meta:
    canonical_id: free_hemoglobin_pct
    label_zh: 游离血红蛋白变化（%）
    direction: lower_is_better
    form: change_from_baseline
    units:
    - percent
    - '%'
- rule_id: endpoint-pnh-free-hemoglobin-v1
  match_pattern: free (hgb|hemoglobin)
  family_meta:
    canonical_id: free_hemoglobin
    label_zh: 游离血红蛋白
    direction: lower_is_better
    form: absolute_value
    units:
    - mg/dL
- rule_id: endpoint-pnh-ldh-change-v1
  match_pattern: ldh|lactate dehydrogenase
  family_meta:
    canonical_id: ldh
    label_zh: LDH 水平变化
    direction: lower_is_better
    form: change_from_baseline
    units:
    - U/L
    - percent
    - '%'
- rule_id: endpoint-pnh-hemoglobin-v1
  match_pattern: hemoglobin|\bhgb\b
  family_meta:
    canonical_id: hemoglobin
    label_zh: 血红蛋白水平/应答
    direction: higher_is_better
    form: change_from_baseline
    units:
    - g/L
    - g/dL
    - percent
    - '%'
- rule_id: endpoint-pnh-transfusion-burden-change-units-v1
  match_pattern: change in (the )?number of rbc units
  family_meta:
    canonical_id: rbc_units_change
    label_zh: 红细胞单位输注变化
    direction: lower_is_better
    form: change_from_baseline
    units:
    - 单位
- rule_id: endpoint-pnh-transfusion-burden-change-v1
  match_pattern: change in (the )?number of (rbc )?transfusion
  family_meta:
    canonical_id: transfusion_burden_change
    label_zh: 输血次数变化
    direction: lower_is_better
    form: change_from_baseline
    units:
    - 次
- rule_id: endpoint-pnh-transfusion-burden-units-v1
  match_pattern: number of rbc units|rbc units transfused
  family_meta:
    canonical_id: rbc_units_burden
    label_zh: 红细胞单位输注数
    direction: lower_is_better
    form: absolute_value
    units:
    - 单位
- rule_id: endpoint-pnh-transfusion-avoidance-v1
  match_pattern: transfusion avoidance|transfusion[- ]free
  family_meta:
    canonical_id: transfusion_avoidance
    label_zh: 输血回避
    direction: higher_is_better
    form: response_rate
    units:
    - Participants
    - percent
    - '%'
- rule_id: endpoint-pnh-transfusion-v1
  match_pattern: transfusion|prbc|packed red blood
  family_meta:
    canonical_id: transfusion
    label_zh: 输血回避/输血量
    direction: higher_is_better
    form: response_rate
    units:
    - Participants
    - percent
    - '%'
- rule_id: endpoint-pnh-breakthrough-hemolysis-v1
  match_pattern: breakthrough|hemolysis
  family_meta:
    canonical_id: breakthrough_hemolysis
    label_zh: 突破性溶血
    direction: lower_is_better
    form: event_rate
    units:
    - Participants
    - percent
    - '%'
- rule_id: endpoint-pnh-survival-v1
  match_pattern: survival|\befs\b|\bdfs\b|engraftment|\banc\b|neutrophil
  family_meta:
    canonical_id: survival
    label_zh: 总生存/植入
    direction: higher_is_better
    form: event_rate
    units:
    - Participants
    - percent
    - '%'
- rule_id: endpoint-pnh-complement-inhibition-v1
  match_pattern: complement|\bc5\b|ch50|pd effect|pharmacodynamic|plasma concentration|free
    c5
  family_meta:
    canonical_id: complement_inhibition
    label_zh: 补体抑制药效学指标
    direction: higher_is_better
    form: absolute_value
    units:
    - percent
    - '%'
- rule_id: endpoint-ad-pp-nrs-v1
  match_pattern: pp[- ]?nrs|peak pruritus|pruritus nrs|瘙痒.*nrs
  family_meta:
    canonical_id: pp_nrs
    label_zh: 峰值瘙痒 NRS
    direction: lower_is_better
    form: change_from_baseline
    units:
    - score
    - points
- rule_id: endpoint-ad-iga-v1
  match_pattern: \biga\b|investigator.*global.*assessment
  family_meta:
    canonical_id: iga
    label_zh: IGA 评分
    direction: lower_is_better
    form: change_from_baseline
    units:
    - score
    - points
- rule_id: endpoint-ad-easi50-v1
  match_pattern: easi[ -]?50|easi_50
  family_meta:
    canonical_id: easi50
    label_zh: EASI-50
    direction: lower_is_better
    form: response_rate
    units:
    - percent
    - '%'
- rule_id: endpoint-ad-easi90-v1
  match_pattern: easi[ -]?90|easi_90
  family_meta:
    canonical_id: easi90
    label_zh: EASI-90
    direction: lower_is_better
    form: response_rate
    units:
    - percent
    - '%'
- rule_id: endpoint-ad-bsa-v1
  match_pattern: \bbsa\b|body surface area|受累体表面积
  family_meta:
    canonical_id: bsa
    label_zh: BSA 受累面积
    direction: lower_is_better
    form: change_from_baseline
    units:
    - percent
    - '%'
- rule_id: endpoint-ad-dlqi-v1
  match_pattern: \bdlqi\b|dermatology life quality
  family_meta:
    canonical_id: dlqi
    label_zh: DLQI 生活质量指数
    direction: lower_is_better
    form: change_from_baseline
    units:
    - score
    - points
- rule_id: endpoint-ad-poit-v1
  match_pattern: poem|patient.*orient.*eczema
  family_meta:
    canonical_id: poem
    label_zh: POEM 评分
    direction: lower_is_better
    form: change_from_baseline
    units:
    - score
    - points
- rule_id: endpoint-ad-wpai-v1
  match_pattern: \bwpai\b|work productivity.*activity
  family_meta:
    canonical_id: wpai
    label_zh: WPAI 工作/活动效率
    direction: lower_is_better
    form: change_from_baseline
    units:
    - percent
    - '%'
- rule_id: endpoint-igan-proteinuria-v1
  match_pattern: proteinuria|upcr|urine protein|protein.*urine|urinary protein
  family_meta:
    canonical_id: proteinuria
    label_zh: 蛋白尿
    direction: lower_is_better
    form: change_from_baseline
    units:
    - g/g
    - mg/mmol
    - g/day
    - ratio
- rule_id: endpoint-igan-egfr-v1
  match_pattern: egfr|estimated.*filtration|gfr|glomerular
  family_meta:
    canonical_id: egfr
    label_zh: eGFR 肾功能
    direction: higher_is_better
    form: change_from_baseline
    units:
    - mL/min
    - ml/min
- rule_id: endpoint-igan-hematuria-v1
  match_pattern: hematuria|blood.*urine|red.*blood.*cell.*urine
  family_meta:
    canonical_id: hematuria
    label_zh: 血尿
    direction: lower_is_better
    form: change_from_baseline
    units:
    - ratio
    - count
- rule_id: endpoint-igan-kidney-function-v1
  match_pattern: kidney|renal.*function|creatinine|serum creatinine|urine.*creatinine
  family_meta:
    canonical_id: kidney_function
    label_zh: 肾功能指标
    direction: lower_is_better
    form: change_from_baseline
    units:
    - mg/dL
    - umol/L
- rule_id: endpoint-uc-mayo-v1
  match_pattern: mayo|partial mayo|mayo score
  family_meta:
    canonical_id: mayo_score
    label_zh: Mayo 评分
    direction: lower_is_better
    form: change_from_baseline
    units:
    - score
    - points
- rule_id: endpoint-uc-remission-v1
  match_pattern: clinical remission|remission
  family_meta:
    canonical_id: clinical_remission
    label_zh: 临床缓解
    direction: higher_is_better
    form: response_rate
    units:
    - percent
    - '%'
- rule_id: endpoint-uc-endoscopic-v1
  match_pattern: endoscopic|mucosal healing|colonoscopy
  family_meta:
    canonical_id: endoscopic_improvement
    label_zh: 内镜改善
    direction: higher_is_better
    form: response_rate
    units:
    - percent
    - '%'
- rule_id: endpoint-uc-bleeding-v1
  match_pattern: bleeding|rectal bleeding|stool frequency
  family_meta:
    canonical_id: bleeding
    label_zh: 出血/排便症状
    direction: lower_is_better
    form: change_from_baseline
    units:
    - score
    - count
- rule_id: endpoint-pnh-registry-generic-v1
  match_pattern: safety|death|infection|events\b|event rate
  family_meta:
    canonical_id: generic
    label_zh: 登记通用观察
    direction: higher_is_better
    form: event_rate
    units:
    - Participants
    - percent
    - '%'
    - count
    - days
- rule_id: endpoint-easi75-response-v1
  match_pattern: easi[ -]?75|easi_75
  family_meta:
    canonical_id: easi75
    label_zh: EASI-75应答
    direction: higher_is_better
    form: response_rate
    units:
    - percent
    - '%'
- rule_id: endpoint-easi-total-change-v1
  match_pattern: easi total|easi score
  family_meta:
    canonical_id: easi_total
    label_zh: EASI总分变化
    direction: lower_is_better
    form: change_from_baseline
    units:
    - points
    - score
- rule_id: endpoint-generic-unclassified-v1
  match_pattern: .+
  family_meta:
    canonical_id: generic_unclassified
    label_zh: 未分类登记观察
    direction: not_applicable
    form: absolute_value
    units:
    - 值
