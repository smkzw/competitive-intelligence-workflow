<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>竞品调研演示运行时验收样稿</title>
    <link rel="stylesheet" href="../../../assets/html-ppt/runtime.css">
    <style>
      body { background: #eceff1; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
      .slide { box-sizing: border-box; padding: 72px 88px; background: #fff; color: #202124; }
      .slide h1 { margin: 0; font-size: 50px; }
      .slide p { max-width: 920px; font-size: 26px; line-height: 1.55; }
      .slide-number { position: absolute; right: 52px; bottom: 34px; font-size: 18px; }
      #efficacy-chart { width: 720px; height: 280px; margin-top: 28px; }
    </style>
  </head>
  <body>
    <main class="deck">
      <section class="slide is-active" data-title="竞品格局">
        <h1>竞品格局</h1>
        <p>以关键临床证据呈现竞品所处阶段与主要差异。</p>
        <span class="slide-number"></span>
        <aside class="notes"><p>本页说明竞品格局及关键证据，不向受众展示系统内部运行记录。</p></aside>
      </section>
      <section class="slide" data-title="主要疗效">
        <h1>主要疗效</h1>
        <p>先呈现图形，再提供可核对的数据表。</p>
        <div id="efficacy-chart" role="img" aria-label="主要疗效比较"></div>
        <span class="slide-number"></span>
        <aside class="notes"><p>本页说明主要终点及对照组效应，提醒跨试验比较需结合研究差异理解。</p></aside>
      </section>
      <section class="slide" data-title="安全性概览">
        <h1>安全性概览</h1>
        <p>以颜色和深浅提示不同安全性维度的数据差异。</p>
        <span class="slide-number"></span>
        <aside class="notes"><p>本页说明严重不良事件、特殊关注不良事件及常见不良事件的差异。</p></aside>
      </section>
    </main>
    <script src="../../../assets/html-ppt/runtime.js"></script>
    <script src="../../../assets/third-party/echarts/echarts.min.js"></script>
    <script>
      (function () {
        const host = document.querySelector("#efficacy-chart");
        if (!host || typeof echarts === "undefined") return;
        const chart = echarts.init(host, null, { renderer: "svg" });
        chart.setOption({
          animation: false,
          xAxis: { type: "category", data: ["竞品甲", "竞品乙", "竞品丙"] },
          yAxis: { type: "value", name: "主要终点变化值" },
          series: [{ name: "治疗组", type: "bar", data: [5.2, 3.8, 4.6] }]
        });
        window.__deck_chart_ready__ = true;
      })();
    </script>
  </body>
</html>
