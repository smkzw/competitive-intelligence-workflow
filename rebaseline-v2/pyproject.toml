[project]
name = "ciw2"
version = "0.2.0.dev0"
description = "临床试验竞品调研平台（重基线 v2）：单用户 Web 服务 + 内嵌最小 Skill Harness"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "jinja2>=3.1",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ciw2 = "ciw2.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ciw2 = ["render/templates/*.html", "render/static/*", "web/templates/*.html", "sources/*.mjs", "skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
