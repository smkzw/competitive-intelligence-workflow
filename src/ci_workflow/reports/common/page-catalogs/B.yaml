contract_version: "1.0"
report: B
portal_title_pattern: "{适应症}临床试验结果比较"
selection_policy:
  top_n_allowed: false
  all_in_scope_objects_visible: true
  default_product_order: "按靶点分组，组内按稳定产品标识"
presentation_policy:
  chart_before_table: true
  graph_and_table_same_fact_set: true
  complete_table_never_replaced_by_summary: true
selection_rules:
  version: "1.0"
  anchor_trial: "依次按注册角色、研究阶段、结果披露成熟度和稳定试验标识选择；不使用疗效或安全性数值偏好。"
  endpoint_family: "同时并列显示适用指导原则推荐的主要终点族与核心竞品共同采用的主要终点族；各终点族均完整保留。"
  common_ae_rows: "强制摘要行优先；其余依次按预定义特别关注不良事件与临床重要性、具有可比已报告值的产品数、最大绝对治疗—对照差、最高报告发生率和稳定术语标识选择默认显示行，不形成安全性排名。"
  baseline_variable_order: "疾病严重程度与关键判定指标、人口学、疾病背景、既往与合并治疗、其他预设变量；组内按规范变量标识。"
  disposition_field_order: "筛选与筛败、随机与接受治疗、完成治疗与完成研究、停止治疗与退出研究、失访、依从性、补救治疗、禁用药、方案偏离。"
bubble_chart_contract:
  y_axis: 原始治疗期间不良事件发生率倒序
  y_axis_annotation: "向上 = 发生率更低 = 观察到的安全性位置更有利"
  x_axis_direction: 越右表示所选疗效指标的观察信号越强
  radius_formula: "r = k × sqrt(N/pi)"
  no_pooling: true
  no_composite_score: true
pages:
  - id: overview
    route: /b/overview
    title: 首页
    navigation_group: 总览
    responsibility: "图在前展示适用指导原则和核心竞品共同采用的主要终点、关键安全性及疗效安全性位置。"
    visuals: [疗效分组柱状图, 安全性热图, 疗效安全性气泡图]
    complete_table: true
    filter_profiles: [b-overview, b-matrix]
    evidence_drawer_profile: common-clinical
  - id: efficacy
    route: /b/efficacy
    title: 疗效
    navigation_group: 疗效与安全性
    responsibility: "展示全部已抽取终点，治疗组与对照组始终并列，并保留原始定义、角色、时间点和差异标记。"
    visuals: [分组柱状图, 不合并森林图, 小多图]
    complete_table: true
    filter_profiles: [b-efficacy]
    evidence_drawer_profile: common-clinical
  - id: longitudinal-results
    route: /b/longitudinal-results
    title: 纵向结果
    navigation_group: 疗效与安全性
    responsibility: "按产品、试验、终点和时间点展示纵向序列，不用多轴或未披露统一评分制造可比性。"
    visuals: [折线图, 纵向小多图]
    complete_table: true
    filter_profiles: [b-longitudinal]
    evidence_drawer_profile: common-clinical
  - id: safety
    route: /b/safety
    title: 安全性
    navigation_group: 疗效与安全性
    responsibility: "比较严重不良事件、特别关注事件、常见事件及发生率，数值印在热图单元格并区分各种披露状态。"
    visuals: [安全性热图, 事件发生率点图, 小多图]
    complete_table: true
    filter_profiles: [b-safety]
    evidence_drawer_profile: common-clinical
  - id: baseline-overview
    route: /b/baseline-overview
    title: 基线与人群总览
    navigation_group: 基线与人群
    responsibility: "概览各试验治疗组与对照组的人口学、疾病语境和基线严重程度，不把均值与中位数或不兼容量表混画。"
    visuals: [基线变量覆盖矩阵, 分组点图, 比例柱状图]
    complete_table: true
    filter_profiles: [b-baseline]
    evidence_drawer_profile: baseline-observation
  - id: baseline-demographics
    route: /b/baseline-demographics
    title: 人口学
    navigation_group: 基线与人群
    responsibility: "比较组别样本量、年龄、性别以及公开的种族、地区、体重等人口学变量，保留来源分类和分母。"
    visuals: [分组点图, 区间图, 比例柱状图]
    complete_table: true
    filter_profiles: [b-baseline-demographics]
    evidence_drawer_profile: baseline-observation
  - id: baseline-disease-context
    route: /b/baseline-disease-context
    title: 疾病语境
    navigation_group: 基线与人群
    responsibility: "比较病程、既往与背景治疗、表型、既往事件、相关合并症和生物标志物。"
    visuals: [分组点图, 比例柱状图, 疾病语境小多图]
    complete_table: true
    filter_profiles: [b-baseline-disease]
    evidence_drawer_profile: baseline-observation
  - id: baseline-severity
    route: /b/baseline-severity
    title: 基线疾病严重程度
    navigation_group: 基线与人群
    responsibility: "按量表版本、方向、单位、时间和统计形式兼容性比较严重度、活动度、实验室或临床锚点。"
    visuals: [严重程度小多图, 区间图, 分组柱状图]
    complete_table: true
    filter_profiles: [b-baseline-severity]
    evidence_drawer_profile: baseline-observation
  - id: disposition-overview
    route: /b/disposition-overview
    title: 试验完成情况总览
    navigation_group: 试验完成情况
    responsibility: "概览筛选、随机、治疗、完成、停止、退出、失访及实施字段；没有可绘制数值时显示披露状态矩阵。"
    visuals: [流转小多图, 分组比例柱状图, 披露状态矩阵]
    complete_table: true
    filter_profiles: [b-disposition]
    evidence_drawer_profile: trial-disposition
    empty_numeric_fallback: 披露状态矩阵
  - id: participant-flow
    route: /b/participant-flow
    title: 受试者流转
    navigation_group: 试验完成情况
    responsibility: "分开呈现筛选、筛败、随机、接受治疗、完成治疗、完成研究、停止治疗、退出研究和失访。"
    visuals: [统一分母小多图, 分组比例柱状图, 受试者流转图]
    complete_table: true
    filter_profiles: [b-participant-flow]
    evidence_drawer_profile: trial-disposition
  - id: adherence
    route: /b/adherence
    title: 依从性
    navigation_group: 试验完成情况
    responsibility: "比较来源定义和阈值明确的依从性指标，不跨定义直接混排。"
    visuals: [分组点图, 比例柱状图, 披露状态矩阵]
    complete_table: true
    filter_profiles: [b-adherence]
    evidence_drawer_profile: trial-disposition
  - id: loss-exit
    route: /b/loss-exit
    title: 失访与退出
    navigation_group: 试验完成情况
    responsibility: "分开呈现失访、停止治疗和退出研究及其主要原因，不把非互斥原因绘成整体构成。"
    visuals: [原因点图, 分组比例柱状图, 披露状态矩阵]
    complete_table: true
    filter_profiles: [b-loss-exit]
    evidence_drawer_profile: trial-disposition
  - id: screen-failure
    route: /b/screen-failure
    title: 筛败与原因
    navigation_group: 试验完成情况
    responsibility: "以筛选人群为分母呈现筛败和原因，不能强行分配到随机组。"
    visuals: [筛败比例柱状图, 原因点图, 披露状态矩阵]
    complete_table: true
    filter_profiles: [b-screen-failure]
    evidence_drawer_profile: trial-disposition
  - id: rescue-treatment
    route: /b/rescue-treatment
    title: 补救治疗
    navigation_group: 试验完成情况
    responsibility: "比较使用补救治疗的人数、比例、分母角色和时间窗，未公开不记为零。"
    visuals: [分组比例柱状图, 时间窗小多图, 披露状态矩阵]
    complete_table: true
    filter_profiles: [b-rescue-treatment]
    evidence_drawer_profile: trial-disposition
  - id: prohibited-medication
    route: /b/prohibited-medication
    title: 禁用药使用
    navigation_group: 试验完成情况
    responsibility: "比较使用禁用药的人数、比例、定义和时间窗，保留来源语境。"
    visuals: [分组比例柱状图, 点图, 披露状态矩阵]
    complete_table: true
    filter_profiles: [b-prohibited-medication]
    evidence_drawer_profile: trial-disposition
  - id: plan-deviation
    route: /b/plan-deviation
    title: 方案偏离
    navigation_group: 试验完成情况
    responsibility: "区分方案偏离的受试者数与事件数，并保留重大偏离、导致排除等来源层级。"
    visuals: [分组点图, 比例柱状图, 披露状态矩阵]
    complete_table: true
    filter_profiles: [b-plan-deviation]
    evidence_drawer_profile: trial-disposition
  - id: trial-exposure-context
    route: /b/trial-exposure-context
    title: 试验与暴露语境
    navigation_group: 试验与证据
    responsibility: "呈现试验角色、治疗与随访窗口、组别规模和暴露差异，为结果解释提供语境。"
    visuals: [暴露时间线, 试验角色矩阵, 样本量气泡图]
    complete_table: true
    filter_profiles: [b-trial-context]
    evidence_drawer_profile: common-clinical
  - id: subgroups-supporting-evidence
    route: /b/subgroups-supporting-evidence
    title: 亚组与支持证据
    navigation_group: 试验与证据
    responsibility: "将早期、延伸、亚组、事后和真实世界结果放在支持层并明确角色，不与核心比较等权。"
    visuals: [证据角色矩阵, 亚组森林图, 支持证据小多图]
    complete_table: true
    filter_profiles: [b-supporting-evidence]
    evidence_drawer_profile: common-clinical
  - id: product-trial-profiles
    route: /b/product-trial-profiles
    title: 产品与试验档案
    navigation_group: 试验与证据
    responsibility: "逐产品、逐试验保留全部终点、安全性事件、基线变量和完成情况字段。"
    visuals: [试验时间线, 结果覆盖矩阵, 组别结构图]
    complete_table: true
    filter_profiles: [b-profiles]
    evidence_drawer_profile: common-clinical
  - id: efficacy-safety-matrix
    route: /b/efficacy-safety-matrix
    title: 疗效与安全性矩阵
    navigation_group: 试验与证据
    responsibility: "以可切换的疗效终点和安全性维度展示观察位置，气泡面积反映治疗组样本量，不生成综合分数。"
    visuals: [疗效安全性气泡图]
    complete_table: true
    filter_profiles: [b-matrix]
    evidence_drawer_profile: common-clinical
