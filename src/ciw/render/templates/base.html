<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · {{ indication.name_zh }}</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-report="{{ report }}">
<header class="top">
  <div class="brand">
    <span class="ind">{{ indication.name_zh }}{% if indication.abbr %}（{{ indication.abbr }}）{% endif %}</span>
    <nav class="reports" aria-label="报告类型">
      {% for key, label in reports.items() %}
      <a href="../{{ key }}/index.html" class="{{ 'on' if key == report else '' }}" {% if key == report %}aria-current="page"{% endif %}>{{ key }} · {{ label }}</a>
      {% endfor %}
    </nav>
  </div>
  <div class="meta">数据截至 {{ cutoff }}</div>
</header>
<main id="app">
<div class="page-heading"><h1>{{ title }}</h1><details class="source-status"><summary>来源覆盖</summary><div id="coverage" class="coverage"></div></details></div>
{% block main %}{% endblock %}</main>
<dialog id="drawer" class="drawer" hidden aria-label="研究详情">
  <header class="drawer-head"><strong>研究详情</strong><button class="close" type="button" aria-label="关闭">关闭</button></header>
  <div class="drawer-body"></div>
</dialog>
<script src="echarts.min.js"></script>
<script src="data.js"></script>
<script src="common.js"></script>
<script src="{{ report|lower }}.js"></script>
</body>
</html>
