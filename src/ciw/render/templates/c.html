{% extends "base.html" %}
{% block main %}
<section class="card">
  <div class="card-h"><h2>设计对照矩阵</h2>
    <div class="filters">
      <input id="q" type="search" placeholder="搜索试验、产品、终点、入排原文">
      <select id="f-phase"><option value="">全部期别</option></select>
      <select id="f-mask"><option value="">全部盲法</option></select>
      <select id="f-concept"><option value="">全部主要终点</option></select>
      <label><input id="f-china" type="checkbox"> 中国研究/登记</label>
      <span id="count" class="hint"></span>
    </div>
  </div>
  <div id="design-view-controls" class="design-view-controls" hidden>
    <div class="view-switch" role="group" aria-label="设计对照视图">
      <button id="view-topics" type="button" aria-pressed="true">主题横比</button>
      <button id="view-comprehensive" type="button" aria-pressed="false">综合设计</button>
    </div>
    <details id="topic-controls">
      <summary id="topic-selection-label">选择比较主题</summary>
      <div class="topic-actions"><button id="topics-all" type="button">全选</button><button id="topics-clear" type="button">清除</button></div>
      <fieldset id="topic-picker"><legend>比较主题</legend></fieldset>
    </details>
  </div>
  <div class="table-wrap"><table id="matrix" class="grid sticky"></table></div>
</section>
<section class="row">
  <div class="card grow"><div class="card-h"><h2>主要终点构成</h2></div><div id="concept-chart" class="chart"></div><div id="concept-single" hidden></div><details><summary>完整数据表</summary><div class="table-wrap"><table id="concept-data" class="grid"></table></div></details></div>
  <div class="card grow"><div class="card-h"><h2>样本量与登记开始日期</h2></div><div id="size-chart" class="chart"></div><div id="size-single" hidden></div><details><summary id="size-data-label">完整数据表</summary><div class="table-wrap"><table id="size-data" class="grid"></table></div></details></div>
</section>
{% endblock %}
