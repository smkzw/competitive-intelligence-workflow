{% extends "base.html" %}
{% block main %}
<div class="layout-b">
  <nav class="qnav card">
    <div class="card-h"><h2>临床问题</h2></div>
    <input id="qsearch" type="search" placeholder="搜索终点、时间点">
    <label class="small"><input id="only-primary" type="checkbox"> 只看含主要终点的问题</label>
    <p><a href="#observations">全部观测与原始数值</a></p>
    <ul id="qlist"></ul>
  </nav>
  <div class="qmain">
    <section class="card">
      <div class="card-h"><h2 id="q-title"></h2><span id="q-sub" class="hint"></span></div>
      <div class="row">
        <div class="grow"><h3>与对照组的差值（试验组−对照组）</h3><div id="diff-chart" class="chart"></div>
          <div id="ratio-wrap" hidden><h3>比值（HR / OR 等，对数轴，参考线为 1）</h3><div id="ratio-chart" class="chart"></div></div></div>
        <div class="grow" id="arm-values"><h3>各组数值</h3><div id="value-chart" class="chart"></div></div>
      </div>
      <h3>组间比较</h3>
      <div class="table-wrap"><table id="comp-table" class="grid"></table></div>
      <div id="arm-details"><h3>各组数值明细</h3>
        <div class="table-wrap"><table id="row-table" class="grid"></table></div></div>
    </section>
    <section class="card">
      <div class="card-h"><h2>历时变化</h2><select id="long-select"></select></div>
      <div id="long-chart" class="chart tall"></div>
    </section>
    <section class="card">
      <div class="card-h"><h2>安全概况</h2><span class="hint">治疗期各组；比例仅由人数/风险人数计算</span></div>
      <div id="sae-chart" class="chart"></div>
      <div class="table-wrap"><table id="safety-table" class="grid"></table></div>
    </section>
    <section class="card" id="observations">
      <details id="observation-detail"><summary><h2>全部观测与原始数值</h2></summary>
        <div class="card-h">
          <div class="filters"><input id="observation-search" type="search" placeholder="搜索药物、研究、终点、分析人群">
            <select id="observation-domain" aria-label="观测类别"><option value="">全部类别</option></select></div>
          <div class="filters"><button id="observation-prev" type="button">上一页</button><span id="observation-count"></span><button id="observation-next" type="button">下一页</button></div>
        </div>
        <div class="table-wrap"><table id="observation-table" class="grid"></table></div>
      </details>
    </section>

  </div>
</div>
{% endblock %}
