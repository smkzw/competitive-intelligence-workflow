# DeepSeek主抽取；cms-smk GLM读原文核对、修正与补漏。凭据只读环境变量。
endpoints:
  dgx:
    base_url: https://spark-a321.tail623d86.ts.net/v1
    key_env: [CIW_DGX_API_KEY]
    key_file_env: [CIW_DGX_KEY_FILE]
    no_proxy: true
  cms-smk:
    base_url: https://new-api.mediportal.com.cn/v1
    key_env: [CMS_SMK_API_KEY]
    no_proxy: false
roles:
  extractor_a: {endpoint: dgx, model: deepseek, family: deepseek, attribute_reasoning_effort: low, max_tokens: 65536, timeout: 7200, response_format: null}
  verifier: {endpoint: cms-smk, model: glm-5.3-flash, family: glm, max_tokens: 65536, timeout: 7200, response_format: null}
