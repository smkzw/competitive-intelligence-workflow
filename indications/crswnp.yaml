concepts:
  - id: surgery_or_scs
    label: 需要鼻息肉手术或全身激素
    patterns: ["(surgery|surgical).*(SCS|systemic corticosteroid|OCS|oral corticosteroid)", "(SCS|systemic corticosteroid|OCS).*(surgery|surgical)"]
    exclude: ["without (surgery|SCS|systemic|OCS)", "concentration"]
    direction: lower_better
  - id: nps
    label: 鼻息肉评分（NPS）
    patterns: ["nasal polyps? score", "\\bNPS\\b", "endoscopic.*nasal polyp", "nasal polyp.*endoscop", "polyp size"]
    direction: lower_better
  - id: ncs
    label: 鼻塞评分（NCS）
    patterns: ["nasal congestion", "congestion score", "nasal obstruction.*(symptom|severity|score)", "\\bNCS\\b", "\\bNC\\b.*score"]
    exclude: ["\\bVAS\\b", "visual analog"]
    direction: lower_better
  - id: vas_composite
    label: 复合症状 VAS
    patterns: ["composite.*(VAS|visual analog)", "(VAS|visual analog).*composite"]
    direction: lower_better
  - id: nasal_obstruction_vas
    label: 鼻塞 VAS
    patterns: ["(nasal obstruction|congestion).*(VAS|visual analog)", "(VAS|visual analog).*(nasal obstruction|congestion)"]
    exclude: ["composite"]
    direction: lower_better
  - id: lmk
    label: 鼻窦 CT Lund-Mackay 评分
    patterns: ["lund[- ]?mackay", "\\bLMK\\b"]
    direction: lower_better
  - id: snot22
    label: SNOT-22 评分
    patterns: ["SNOT[- ]?22", "sino[- ]?nasal outcome test"]
    exclude: ["domain", "subscale", "sub-score", "subscore"]
    direction: lower_better
  - id: upsit
    label: 嗅觉识别测试（UPSIT）
    patterns: ["UPSIT", "university of pennsylvania smell"]
    direction: higher_better
  - id: loss_of_smell
    label: 嗅觉丧失评分
    patterns: ["loss of smell", "sense of smell", "smell score", "\\bLoS\\b"]
    exclude: ["UPSIT", "university of pennsylvania"]
    direction: lower_better
  - id: tss
    label: 总症状评分（TSS）
    patterns: ["total symptom score", "\\bTSS\\b"]
    direction: lower_better
  - id: tnss
    label: 鼻部总症状评分（TNSS）
    patterns: ["\\bTNSS\\b", "total nasal symptom"]
    direction: lower_better
  - id: scs_use
    label: 全身激素使用
    patterns: ["systemic corticosteroid", "\\bSCS\\b", "oral corticosteroid", "\\bOCS\\b"]
    direction: lower_better
  - id: surgery
    label: 鼻息肉手术
    patterns: ["(nasal|sinus|NP|polyp) surgery", "polypectomy", "surgery for nasal polyp"]
    direction: lower_better
  - id: vas_overall
    label: 总体症状 VAS
    patterns: ["(overall|total) (symptom )?VAS", "VAS.*(overall|total) symptom"]
    direction: lower_better
  - id: pnif
    label: 鼻吸气峰流速（PNIF）
    patterns: ["PNIF", "peak nasal inspiratory"]
    direction: higher_better
  - id: fev1
    label: FEV1（合并哮喘）
    patterns: ["FEV ?1"]
    direction: higher_better
  - id: acq
    label: 哮喘控制问卷（ACQ）
    patterns: ["\\bACQ"]
    direction: lower_better
