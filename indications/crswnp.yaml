# CRSwNP 适应症配置（v2）
# 规则：
# - name_zh 只填已核实的正式中文通用名；没核实的留空，门户会显示 INN/代号，不机器翻译。
# - target/mechanism/company 这类属性只填有把握的；没把握的留空，交给属性核对任务
#   （CT.gov 干预描述 + 企业/监管来源，异构模型交叉核对）补齐。
# - aliases 用于把 CT.gov / CDE 里的干预名映射到产品，必须一对一；配置加载时会做冲突校验。
slug: crswnp
name_zh: 慢性鼻窦炎伴鼻息肉
name_en: Chronic rhinosinusitis with nasal polyps
abbr: CRSwNP

ctgov:
  conditions:
    - nasal polyps
    - chronic rhinosinusitis with nasal polyps
    - chronic rhinosinusitis with nasal polyposis
  relevance_patterns:
    - nasal polyp
    - polyposis
    - CRSwNP
    - rhinosinusitis with (nasal )?polyp
    - 鼻息肉
  relevance_exclude_patterns:
    - '(?<!with or )(?<!with and )without\s+(?:nasal\s+)?polyps?'
    - '(?<!或)(?:不伴(?:有)?|无)鼻息肉'

china:
  cde_queries: [鼻息肉, 慢性鼻窦炎伴鼻息肉, MG-K10]
  nmpa_queries: [度普利尤单抗, 奥马珠单抗, 美泊利珠单抗, 司普奇拜单抗]
  wechat_accounts: [丁香园Insight数据库, 医药魔方Info]
  wechat_queries: [鼻息肉 III期, CRSwNP 获批, 鼻息肉 临床试验 结果]

# 只索引对应原文，不根据关键词推定人群资格或数值。
design_topics:
  - label: 鼻息肉评分
    patterns: ['\bNPS\b', 'polyp.{0,25}score', '鼻息肉.{0,12}评分']
  - label: 鼻塞评分
    patterns: ['\bNCS\b', '(?:congestion|obstruction).{0,25}score', '鼻塞.{0,12}评分']
  - label: 既往手术
    patterns: ['surger', '手术']
  - label: 全身激素
    patterns: ['systemic.{0,20}(?:corticosteroid|steroid)', '全身.{0,10}激素']
  - label: 合并哮喘
    patterns: ['asthma', '哮喘']
  - label: 背景治疗与救援
    patterns: ['rescue', 'background therap', 'intranasal corticosteroid', '救援', '背景治疗', '鼻用.{0,8}激素']
  - label: 随机比例
    patterns: ['randomi.{0,60}ratio', 'ratio.{0,30}\d+\s*:\s*\d+', '随机.{0,30}比例']
  - label: 给药与治疗期
    patterns: ['\b(?:mg|mcg|q2w|q4w|weekly|biweekly)\b', '治疗.{0,15}周', '给药']

# 背景/对照/救援治疗：出现在试验里，但不进入竞品宇宙
background_patterns:
  - placebo
  - \bsaline\b
  - mometasone
  - fluticasone
  - budesonide
  - beclomethasone
  - ciclesonide
  - triamcinolone
  - predniso
  - methylpredniso
  - corticosteroid
  - glucocorticoid
  - \bINCS\b
  - standard (of care|therapy)
  - usual therapy
  - nasonex
  - flonase
  - doxycycline
  - azithromycin
  - augmentin|amoxicillin
  - clarithromycin|rifampicin
  - itraconazole
  - montelukast
  - vitamin d
  - fish oil
  - lansoprazole
  - furosemide
  - tranexamic
  - bupivacaine|remifentanil|tramadol|metoprolol|dexmedetomidin|esketamine|epinephrine|adrenaline
  - desmopressin
  - mupirocin
  - acetyl ?salicylic|aspirin
  - verapamil
  - botox
  - run in medication
  - biologic (agents|treatments)
  - dosage of 17 cytokines
  - sugar pill
  # 中文登记（CDE）中的背景/对照/传统治疗
  - 安慰剂
  - 模拟剂
  - 处方缓冲液
  - 莫米松
  - 布地奈德
  - 氟替卡松
  - 倍氯米松
  - 泼尼松
  - 甲泼尼龙
  - 糖皮质激素
  - 生理盐水

